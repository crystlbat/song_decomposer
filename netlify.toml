# The Netlify copy of Tapline is the account version: same index.html, but a
# username/password login in front of it and scenes kept server-side, so
# saving is just saving. The GitHub Pages copy has no /api and falls back to
# the Drive + push/pull flow on its own.

[build]
  publish = "."
  # There is nothing to build — index.html ships as it is. This is only here
  # so the function's one dependency is installed before it is bundled.
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One function answers everything under /api.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
